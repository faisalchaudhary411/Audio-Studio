# Builds the Chatterbox voice-clone RunPod worker image and pushes it to
# GitHub Container Registry (ghcr.io) — runs entirely on GitHub's servers,
# so this works from your phone: edit runpod_workers/chatterbox/ files via
# the GitHub web editor, push/commit, and this builds automatically. No
# Docker daemon needed on your end.
#
# After the first successful run:
#   1. Go to your GitHub profile → Packages → find "voxcraft-clone-worker"
#   2. Make it public (Package settings → Change visibility) so RunPod can
#      pull it without needing a registry login
#   3. Copy the image URL, e.g. ghcr.io/<your-username>/voxcraft-clone-worker:latest
#   4. In RunPod: Serverless → New Endpoint → Custom Source → paste that
#      image URL → pick a GPU tier (8GB+ VRAM, e.g. RTX 4000/A4000-class)
#   5. Copy the resulting endpoint ID into RUNPOD_CLONE_ENDPOINT_ID on your
#      VPS, alongside RUNPOD_API_KEY from RunPod's dashboard

name: Build clone worker image

on:
  push:
    branches: [main]
    paths:
      - "runpod_workers/chatterbox/**"
      - ".github/workflows/build-clone-worker.yml"
  workflow_dispatch: {}  # lets you manually re-trigger from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod_workers/chatterbox
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voxcraft-clone-worker:latest
            ghcr.io/${{ github.repository_owner }}/voxcraft-clone-worker:${{ github.sha }}
          # Caches Docker layers in GitHub's own cache storage (free, no
          # extra setup). Because the Dockerfile installs torch/chatterbox
          # BEFORE copying handler.py, a handler-only change reuses every
          # cached layer up to that point and only re-runs the final COPY
          # + push — a ~15-20 min build drops to well under a minute.
          # Changing requirements.txt or the Dockerfile itself still
          # invalidates the relevant layers and rebuilds from there, same
          # as normal Docker caching.
          cache-from: type=gha
          cache-to: type=gha,mode=max
