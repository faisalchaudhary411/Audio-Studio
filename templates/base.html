<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VoxCraft{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">

<header class="nav">
  <a href="{{ url_for('landing') }}" class="nav__brand">
    <span class="nav__mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22"><path d="M4 16h3l3-9 4 18 4-13 3 4h11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    VoxCraft
  </a>
  <nav class="nav__links">
    <a href="{{ url_for('studio') }}">Studio</a>
    <a href="{{ url_for('pricing') }}">Pricing</a>
    <a href="{{ url_for('landing') }}#voices">Voices</a>
  </nav>
  <a href="{{ url_for('studio') }}" class="btn btn--brass btn--sm nav__cta">Open Studio</a>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="footer__row">
    <span>VoxCraft</span>
    <span>&copy; {{ 2026 }} — text to voice, crafted.</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
