<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0C1117;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:16px;
}
.adbox{
  background:#141B24;
  border:1px solid rgba(245,242,234,0.1);
  border-radius:16px;
  padding:20px 18px 18px;
  max-width:440px;width:100%;
  text-align:center;
  box-shadow:0 16px 48px rgba(0,0,0,0.45);
}
.lbl{
  color:rgba(245,242,234,0.4);
  font-size:0.68rem;text-transform:uppercase;
  letter-spacing:0.12em;margin-bottom:12px;
  font-weight:500;
}
.adwrap{
  min-height:250px;
  display:flex;align-items:center;justify-content:center;
  margin:0 0 12px;
  background:rgba(0,0,0,0.2);
  border-radius:10px;
  padding:8px;
  overflow:hidden;
}
.tmr{color:rgba(245,242,234,0.45);font-size:0.82rem;margin:4px 0 10px}
.skipbtn{
  background:linear-gradient(180deg,#F5C670,#E8A93C);
  color:#1A1204;border:none;
  padding:11px 22px;border-radius:12px;
  font-weight:700;cursor:pointer;font-size:0.9rem;
  width:100%;max-width:260px;
}
.skipbtn:disabled{
  background:rgba(245,242,234,0.08);
  color:rgba(245,242,234,0.3);
  cursor:not-allowed;
}
.pro{color:rgba(245,242,234,0.3);font-size:0.75rem;margin-top:14px}
.pro a{color:#E8A93C;text-decoration:none}
.pro a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="adbox">
  <div class="lbl">Sponsored · Preparing your audio</div>
  <div class="adwrap">
    <script>
      atOptions = {
        'key' : 'fd9eadcb73a0e7062be27d30dc72f82a',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script src="https://www.highrevenueformat.com/fd9eadcb73a0e7062be27d30dc72f82a/invoke.js"></script>
  </div>
  <div class="tmr" id="tmr">Ad closes in 5s…</div>
  <button class="skipbtn" id="skipBtn" disabled>Please wait…</button>
  <div class="pro"><a href="/upgrade" target="_parent">Remove ads with Pro →</a></div>
</div>
<script>
(function(){
  var s=5, tmr=document.getElementById("tmr"), btn=document.getElementById("skipBtn");
  function done(){ window.parent.postMessage('voxcraft-interstitial-done', '*'); }
  btn.onclick = done;
  var iv=setInterval(function(){
    s--;
    if(s<=0){ clearInterval(iv); done(); }
    else{
      tmr.textContent = "Ad closes in " + s + "s…";
      if(s<=2){ btn.disabled=false; btn.textContent = "Continue (" + s + ")"; }
    }
  }, 1000);
})();
</script>
</body>
</html>
