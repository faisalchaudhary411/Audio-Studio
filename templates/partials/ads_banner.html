{# In-content sponsored unit — free tier only. Matches site chrome so it
   reads as a deliberate placement, not a raw network dump. #}
<aside class="ad-unit" aria-label="Sponsored">
  <div class="ad-unit__head">
    <span class="ad-unit__badge">Sponsored</span>
    <a href="{{ url_for('upgrade') }}" class="ad-unit__remove">Remove ads with Pro</a>
  </div>
  <div class="ad-unit__frame">
    <iframe
      src="{{ url_for('ads_slot', slot='banner') }}"
      title="Sponsored content"
      loading="lazy"
      scrolling="no"
      sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
      class="ad-unit__iframe"></iframe>
  </div>
</aside>
