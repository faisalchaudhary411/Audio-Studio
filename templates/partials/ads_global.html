{# Mobile sticky sponsored bar.
   Hidden on Studio because the Generate bar already owns the bottom edge. #}
<style>
.ad-sticky {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 28;
  display: none;
  height: 50px;
  overflow: hidden;
  background: rgba(12, 17, 23, 0.97);
  border-top: 1px solid rgba(245, 242, 234, 0.1);
}
.ad-sticky__label {
  position: absolute;
  top: 3px; left: 10px;
  font-family: var(--mono, ui-monospace, monospace);
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(245, 242, 234, 0.35);
  pointer-events: none;
  z-index: 1;
}
.ad-sticky iframe {
  width: 100%;
  height: 50px;
  border: 0;
  display: block;
}
@media (max-width: 768px) {
  body.has-sticky-ad:not(.has-studio-sticky) .ad-sticky { display: block; }
  body.has-sticky-ad:not(.has-studio-sticky) {
    padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px)) !important;
  }
  body.has-sticky-ad:not(.has-studio-sticky) .footer {
    padding-bottom: calc(40px + 50px + env(safe-area-inset-bottom, 0px));
  }
  body.has-sticky-ad:not(.has-studio-sticky) .sticky-cta {
    bottom: calc(50px + env(safe-area-inset-bottom, 0px));
  }
}
</style>
<div class="ad-sticky" id="ad-sticky" aria-label="Sponsored">
  <span class="ad-sticky__label">Sponsored</span>
  <iframe src="{{ url_for('ads_slot', slot='sticky_footer') }}" scrolling="no" title="Sponsored content" loading="lazy"></iframe>
</div>
<script>
(function () {
  if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
    document.body.classList.add('has-sticky-ad');
  }
})();
</script>
