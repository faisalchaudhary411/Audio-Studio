  <div class="panel">
    <span class="panel__label">Denoise</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Reduces background hiss/hum using spectral noise reduction. Works best on speech with fairly steady background noise (fans, room tone) — won't remove sudden noises like claps or barks. Up to 10MB. Output is mono.</p>
    <input type="file" class="file-input" id="denoise-file" accept=".wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Strength: <span id="denoise-strength-label">0.5</span></label>
    <input type="range" class="studio-range" id="denoise-strength" min="0" max="1" step="0.05" value="0.5" style="width:100%;margin-bottom:10px;">
    <div class="render-bar">
      <button class="btn btn--brass" id="denoise-btn">Remove noise</button>
      <span class="render-status" data-denoise-status></span>
    </div>
    <div id="denoise-result" style="margin-top:14px;"></div>
  </div>
