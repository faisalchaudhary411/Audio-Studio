  <div class="panel">
    <span class="panel__label">Denoise</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Reduce steady noise (fan, AC, hiss). Start with Light or Medium — Strong can dull speech. Up to 10MB.</p>
    <input type="file" class="file-input" id="denoise-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac,audio/wav,audio/mpeg,audio/ogg,audio/mp4,audio/flac" style="margin-bottom:12px;">
    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Strength: <span id="denoise-strength-label">Medium</span></label>
    <input type="range" class="studio-range" id="denoise-strength" min="0.2" max="0.9" step="0.05" value="0.55" style="width:100%;margin-bottom:8px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button type="button" class="btn btn--ghost btn--sm" data-denoise-preset="0.35">Light</button>
      <button type="button" class="btn btn--ghost btn--sm" data-denoise-preset="0.55">Medium</button>
      <button type="button" class="btn btn--ghost btn--sm" data-denoise-preset="0.8">Strong</button>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:0.85rem;color:var(--text-mid);margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="denoise-stationary" checked>
      Stationary noise mode (better for fan / AC hum)
    </label>
    <div class="render-bar">
      <button class="btn btn--brass" id="denoise-btn">Remove noise</button>
      <span class="render-status" data-denoise-status></span>
    </div>
    <div id="denoise-result" style="margin-top:14px;"></div>
  </div>
