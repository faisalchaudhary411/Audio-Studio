  <div class="panel">
    <span class="panel__label">Transcribe</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Converts speech in an audio file to text. Supports WAV, MP3, M4A, OGG, FLAC — up to 10MB. Long files are processed in chunks, so it works for anything from a voice memo to a full interview.</p>
    <input type="file" class="file-input" id="transcribe-file" accept=".wav,.mp3,.m4a,.ogg,.flac" < class="file-input" style="margin-bottom:12px;">
    <select id="transcribe-lang" class="studio-select" style="margin-bottom:12px;">
      {% for name, code in lang_options.items() %}
      <option value="{{ code }}">{{ name }}</option>
      {% endfor %}
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="transcribe-btn">Transcribe</button>
      <span class="render-status" data-transcribe-status></span>
    </div>
    <div id="transcribe-result" style="margin-top:14px;"></div>
  </div>
