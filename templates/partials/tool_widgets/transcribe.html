  <div class="panel">
    <span class="panel__label">Transcribe</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Speech to text. Choose language (Urdu and Hindi included). Returns text plus a simple SRT for captions. Up to 10MB.</p>
    <input type="file" class="file-input" id="transcribe-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac,audio/wav,audio/mpeg,audio/ogg,audio/mp4,audio/flac" style="margin-bottom:12px;">
    <select id="transcribe-lang" class="studio-select" style="margin-bottom:12px;">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="ur-PK">Urdu</option>
      <option value="hi-IN">Hindi</option>
      <option value="ar-SA">Arabic</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
      <option value="pt-BR">Portuguese</option>
      <option value="zh-CN">Chinese (Mandarin)</option>
      <option value="ja-JP">Japanese</option>
      <option value="ko-KR">Korean</option>
      <option value="tr-TR">Turkish</option>
      <option value="ru-RU">Russian</option>
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="transcribe-btn">Transcribe</button>
      <span class="render-status" data-transcribe-status></span>
    </div>
    <div id="transcribe-result" style="margin-top:14px;"></div>
  </div>
