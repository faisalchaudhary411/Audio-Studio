  <div class="panel">
    <span class="panel__label">Split by silence</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Cut a long recording into separate clips wherever there is a pause. Useful for interviews and multi-take voiceovers. Up to 10MB · max 20 parts.</p>
    <input type="file" class="file-input" id="split-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Min silence: <span id="split-silence-label">500</span> ms</label>
        <input type="range" class="studio-range" id="split-silence" min="200" max="2000" step="50" value="500" style="width:100%;">
      </div>
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Silence threshold: <span id="split-thresh-label">-40</span> dBFS</label>
        <input type="range" class="studio-range" id="split-thresh" min="-55" max="-25" step="1" value="-40" style="width:100%;">
      </div>
    </div>
    <select id="split-format" class="studio-select" style="margin-bottom:12px;">
      <option value="mp3">MP3</option><option value="wav">WAV</option>
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="split-btn">Split</button>
      <span class="render-status" data-split-status></span>
    </div>
    <div id="split-result" style="margin-top:14px;"></div>
  </div>
