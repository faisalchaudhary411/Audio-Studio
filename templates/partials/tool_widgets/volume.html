  <div class="panel">
    <span class="panel__label">Adjust volume</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Boost or lower the whole clip by a fixed amount (dB). Prefer Normalize if you want a consistent peak level. Up to 10MB.</p>
    <input type="file" class="file-input" id="volume-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Gain: <span id="volume-gain-label">0</span> dB</label>
    <input type="range" class="studio-range" id="volume-gain" min="-12" max="12" step="1" value="0" style="width:100%;margin-bottom:12px;">
    <select id="volume-format" class="studio-select" style="margin-bottom:12px;">
      <option value="mp3">MP3</option><option value="wav">WAV</option>
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="volume-btn">Apply</button>
      <span class="render-status" data-volume-status></span>
    </div>
    <div id="volume-result" style="margin-top:14px;"></div>
  </div>
