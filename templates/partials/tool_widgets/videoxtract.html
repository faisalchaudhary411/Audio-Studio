  <div class="panel">
    <span class="panel__label">Video to Audio</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Extracts the audio track from a video file. Supports MP4, AVI, MOV, MKV, WEBM — <strong style="color:var(--brass-hi);">up to 50MB</strong> (larger than the other tools, since video files are naturally bigger). Files over the limit, or corrupted/incomplete uploads, will fail with an error rather than a silent hang.</p>
    <input type="file" class="file-input" id="videoxtract-file" accept=".mp4,.avi,.mov,.mkv,.webm" < class="file-input" style="margin-bottom:12px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <select id="videoxtract-format" class="studio-select">
        <option value="mp3">MP3</option><option value="wav">WAV</option><option value="ogg">OGG</option>
      </select>
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Quality: <span id="videoxtract-quality-label">192</span> kbps</label>
        <input type="range" class="studio-range" id="videoxtract-quality" min="64" max="320" step="16" value="192" style="width:100%;">
      </div>
    </div>
    <div class="render-bar">
      <button class="btn btn--brass" id="videoxtract-btn">Extract audio</button>
      <span class="render-status" data-videoxtract-status></span>
    </div>
    <div id="videoxtract-result" style="margin-top:14px;"></div>
  </div>
