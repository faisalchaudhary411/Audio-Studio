  <div class="panel">
    <span class="panel__label">Convert</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Change format and bitrate. Use a preset for common jobs, or set format manually. Up to 10MB.</p>
    <input type="file" class="file-input" id="convert-file" accept=".wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);display:block;margin-bottom:6px;">Preset (optional)</label>
    <select id="convert-preset" class="studio-select" style="margin-bottom:12px;">
      <option value="">Custom</option>
      <option value="youtube">YouTube voiceover (MP3 192k)</option>
      <option value="social">Social / Shorts (MP3 160k)</option>
      <option value="podcast">Podcast delivery (MP3 128k)</option>
      <option value="edit_master">Edit master (WAV)</option>
      <option value="archive">Archive (FLAC)</option>
    </select>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <select id="convert-format" class="studio-select">
        <option value="mp3">MP3</option><option value="wav">WAV</option>
        <option value="ogg">OGG</option><option value="m4a">M4A</option><option value="flac">FLAC</option>
      </select>
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Quality: <span id="convert-quality-label">192</span> kbps</label>
        <input type="range" class="studio-range" min="64" max="320" step="16" value="192" id="convert-quality" style="width:100%;">
      </div>
    </div>
    <div class="render-bar">
      <button class="btn btn--brass" id="convert-btn">Convert</button>
      <span class="render-status" data-convert-status></span>
    </div>
    <div id="convert-result" style="margin-top:14px;"></div>
  </div>
