  <div class="panel">
    <span class="panel__label">Change speed</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Speed up or slow down a clip. Pitch shifts with speed (practical for Shorts / voice memos). Range 0.5×–2.0×. Up to 10MB.</p>
    <input type="file" class="file-input" id="speed-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Speed: <span id="speed-rate-label">1.00</span>×</label>
    <input type="range" class="studio-range" id="speed-rate" min="0.5" max="2" step="0.05" value="1" style="width:100%;margin-bottom:8px;">
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
      <button type="button" class="btn btn--ghost btn--sm" data-speed-preset="0.75">0.75×</button>
      <button type="button" class="btn btn--ghost btn--sm" data-speed-preset="1">1×</button>
      <button type="button" class="btn btn--ghost btn--sm" data-speed-preset="1.25">1.25×</button>
      <button type="button" class="btn btn--ghost btn--sm" data-speed-preset="1.5">1.5×</button>
    </div>
    <select id="speed-format" class="studio-select" style="margin-bottom:12px;">
      <option value="mp3">MP3</option><option value="wav">WAV</option>
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="speed-btn">Change speed</button>
      <span class="render-status" data-speed-status></span>
    </div>
    <div id="speed-result" style="margin-top:14px;"></div>
  </div>
