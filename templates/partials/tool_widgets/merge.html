  <div class="panel">
    <span class="panel__label">Merge</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Combine clips in order. Use a short crossfade to avoid clicks at joins, or a silence gap. Up to 10MB per file.</p>
    <input type="file" class="file-input" id="merge-files" accept=".wav,.mp3,.ogg,.m4a,.flac" multiple style="margin-bottom:12px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Gap between clips (ms)</label>
        <input type="number" class="studio-input" id="merge-gap" value="0" min="0" max="5000" step="50" style="width:100%;">
      </div>
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Crossfade (ms)</label>
        <input type="number" class="studio-input" id="merge-crossfade" value="80" min="0" max="500" step="10" style="width:100%;">
        <span style="font-size:0.72rem;color:var(--text-dim);">Overrides gap when &gt; 0</span>
      </div>
    </div>
    <select id="merge-format" class="studio-select" style="margin-bottom:12px;">
      <option value="mp3">MP3</option>
      <option value="wav">WAV</option>
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="merge-btn">Merge</button>
      <span class="render-status" data-merge-status></span>
    </div>
    <div id="merge-result" style="margin-top:14px;"></div>
  </div>
