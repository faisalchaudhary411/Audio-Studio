  <div class="panel">
    <span class="panel__label">Reverse audio</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Play the clip backwards. Up to 10MB.</p>
    <input type="file" class="file-input" id="reverse-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <select id="reverse-format" class="studio-select" style="margin-bottom:12px;">
      <option value="mp3">MP3</option><option value="wav">WAV</option>
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="reverse-btn">Reverse</button>
      <span class="render-status" data-reverse-status></span>
    </div>
    <div id="reverse-result" style="margin-top:14px;"></div>
  </div>
