  <div class="panel">
    <span class="panel__label">Simple EQ</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Boost or cut bass and treble. Light-touch tool for voice clarity or warmer beds — not a full studio EQ. Up to 10MB.</p>
    <input type="file" class="file-input" id="eq-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Bass: <span id="eq-bass-label">0</span> dB</label>
    <input type="range" class="studio-range" id="eq-bass" min="-12" max="12" step="1" value="0" style="width:100%;margin-bottom:10px;">
    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Treble: <span id="eq-treble-label">0</span> dB</label>
    <input type="range" class="studio-range" id="eq-treble" min="-12" max="12" step="1" value="0" style="width:100%;margin-bottom:12px;">
    <select id="eq-format" class="studio-select" style="margin-bottom:12px;">
      <option value="mp3">MP3</option><option value="wav">WAV</option>
    </select>
    <div class="render-bar">
      <button class="btn btn--brass" id="eq-btn">Apply EQ</button>
      <span class="render-status" data-eq-status></span>
    </div>
    <div id="eq-result" style="margin-top:14px;"></div>
  </div>
