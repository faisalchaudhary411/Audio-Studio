  <div class="panel">
    <span class="panel__label">Autotune</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">
      Professional pitch correction — tracks pitch, snaps to a key &amp; scale.
      Fast retune = hard Autotune; slower = natural. Max 5 minutes per file.
      <strong>{{ upload_limit_mb }}MB max</strong>{% if not is_pro_ctx %} (Pro: {{ upload_pro_mb }}MB){% endif %}.
    </p>
    <input type="file" class="file-input" id="autotune-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac,audio/wav,audio/mpeg,audio/ogg,audio/mp4" style="margin-bottom:12px;">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);display:block;margin-bottom:4px;">Key</label>
        <select id="autotune-key" class="studio-select" style="width:100%;">
          <option value="auto" selected>Auto (detect)</option>
          <option value="C">C</option>
          <option value="C#">C# / Db</option>
          <option value="D">D</option>
          <option value="D#">D# / Eb</option>
          <option value="E">E</option>
          <option value="F">F</option>
          <option value="F#">F# / Gb</option>
          <option value="G">G</option>
          <option value="G#">G# / Ab</option>
          <option value="A">A</option>
          <option value="A#">A# / Bb</option>
          <option value="B">B</option>
        </select>
      </div>
      <div>
        <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);display:block;margin-bottom:4px;">Scale</label>
        <select id="autotune-scale" class="studio-select" style="width:100%;">
          <option value="major" selected>Major</option>
          <option value="minor">Natural minor</option>
          <option value="harmonic_minor">Harmonic minor</option>
          <option value="pentatonic_major">Pentatonic major</option>
          <option value="pentatonic_minor">Pentatonic minor</option>
          <option value="blues">Blues</option>
          <option value="dorian">Dorian</option>
          <option value="mixolydian">Mixolydian</option>
          <option value="chromatic">Chromatic (12-TET)</option>
        </select>
      </div>
    </div>

    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Strength: <span id="autotune-strength-label">100</span>%</label>
    <input type="range" class="studio-range" id="autotune-strength" min="0" max="100" step="5" value="100" style="width:100%;margin-bottom:10px;">

    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Retune speed: <span id="autotune-speed-label">70</span>% <span style="color:var(--text-dim);">(slow → hard)</span></label>
    <input type="range" class="studio-range" id="autotune-speed" min="0" max="100" step="5" value="70" style="width:100%;margin-bottom:8px;">
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
      <button type="button" class="btn btn--ghost btn--sm" data-autotune-preset="natural">Natural</button>
      <button type="button" class="btn btn--ghost btn--sm" data-autotune-preset="balanced">Balanced</button>
      <button type="button" class="btn btn--ghost btn--sm" data-autotune-preset="hard">Hard Autotune</button>
    </div>

    <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Humanize: <span id="autotune-humanize-label">0</span>%</label>
    <input type="range" class="studio-range" id="autotune-humanize" min="0" max="100" step="5" value="0" style="width:100%;margin-bottom:12px;">

    <select id="autotune-format" class="studio-select" style="margin-bottom:12px;">
      <option value="mp3">MP3</option>
      <option value="wav">WAV</option>
    </select>

    <div class="render-bar">
      <button class="btn btn--brass" id="autotune-btn">Autotune</button>
      <span class="render-status" data-autotune-status></span>
    </div>
    <div id="autotune-result" style="margin-top:14px;"></div>
  </div>
