  <div class="panel">
    <span class="panel__label">Cutter</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Trim a range, split at a point, or auto-remove leading/trailing silence. Up to 10MB.</p>
    <input type="file" class="file-input" id="cutter-file" accept=".wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:12px;">
    <div id="cutter-duration" style="font-family:var(--mono);font-size:0.82rem;color:var(--text-dim);margin-bottom:10px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <button class="btn btn--sm btn--brass" data-cutter-mode="trim">Trim (start–end)</button>
      <button class="btn btn--sm btn--ghost" data-cutter-mode="split">Split at time</button>
      <button class="btn btn--sm btn--ghost" data-cutter-mode="auto">Auto-trim silence</button>
    </div>
    <div id="cutter-trim-controls">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Start (sec)</label>
          <input type="number" class="studio-input" id="cutter-start" value="0" min="0" step="0.1" style="width:100%;">
        </div>
        <div>
          <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">End (sec)</label>
          <input type="number" class="studio-input" id="cutter-end" value="0" min="0" step="0.1" style="width:100%;">
        </div>
      </div>
    </div>
    <div id="cutter-split-controls" style="display:none;margin-bottom:12px;">
      <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Split at (sec)</label>
      <input type="number" class="studio-input" id="cutter-split" value="0" min="0" step="0.1" style="width:100%;">
    </div>
    <div class="render-bar">
      <button class="btn btn--brass" id="cutter-btn">Apply</button>
      <span class="render-status" data-cutter-status></span>
    </div>
    <div id="cutter-result" style="margin-top:14px;"></div>
  </div>
