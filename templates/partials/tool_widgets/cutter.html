  <div class="panel">
    <span class="panel__label">Cutter</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Trim a clip to a start/end range, or split it into two files at a chosen point. Up to 10MB.</p>
    <input type="file" id="cutter-file" accept=".wav,.mp3,.ogg,.m4a,.flac" style="margin-bottom:10px;">
    <div id="cutter-duration" style="font-family:var(--mono);font-size:0.82rem;color:var(--text-dim);margin-bottom:10px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn--sm btn--brass" data-cutter-mode="trim">Trim (start-end)</button>
      <button class="btn btn--sm btn--ghost" data-cutter-mode="split">Split at time</button>
    </div>

    <div id="cutter-trim-controls">
      <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Start (s)</label>
      <input type="number" id="cutter-start" value="0" min="0" step="0.1" class="admin-input" style="width:100%;margin-bottom:8px;">
      <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">End (s)</label>
      <input type="number" id="cutter-end" value="0" min="0" step="0.1" class="admin-input" style="width:100%;">
    </div>
    <div id="cutter-split-controls" style="display:none;">
      <label style="font-family:var(--mono);font-size:0.78rem;color:var(--text-mid);">Split at (s)</label>
      <input type="number" id="cutter-split-at" value="0" min="0" step="0.1" class="admin-input" style="width:100%;">
    </div>

    <div class="render-bar">
      <button class="btn btn--brass" id="cutter-btn">Run</button>
      <span class="render-status" data-cutter-status></span>
    </div>
    <div id="cutter-result" style="margin-top:14px;"></div>
  </div>
