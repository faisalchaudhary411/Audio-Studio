  <div class="panel">
    <span class="panel__label">Decompress</span>
    <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px;">Turn a compressed file (MP3, OGG, M4A) into an uncompressed WAV. Note: this can't restore detail already lost in the original compression — it just stops further quality loss from here on. Up to 15MB.</p>
    <input type="file" class="file-input" id="decompress-file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac,.aac,.wma,audio/wav,audio/x-wav,audio/mpeg,audio/mp3,audio/ogg,audio/mp4,audio/x-m4a,audio/flac,audio/x-flac" style="margin-bottom:12px;">
    <div class="render-bar">
      <button class="btn btn--brass" id="decompress-btn">Decompress to WAV</button>
      <span class="render-status" data-decompress-status></span>
    </div>
    <div id="decompress-result" style="margin-top:14px;"></div>
  </div>
