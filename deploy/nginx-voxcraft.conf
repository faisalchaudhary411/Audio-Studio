# /etc/nginx/sites-available/voxcraft
#
# Install with:
#   sudo cp nginx-voxcraft.conf /etc/nginx/sites-available/voxcraft
#   sudo ln -s /etc/nginx/sites-available/voxcraft /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot to get HTTPS + auto-redirect (it edits this file in place):
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# EDIT server_name below to your actual domain before installing.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;   # EDIT THIS

    # Matches app.py's MAX_CONTENT_LENGTH (50MB) — reject oversized uploads
    # at the proxy before they even reach gunicorn/Python.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # IMPORTANT — this is what makes the app's IP-spoofing fix actually
        # work. X-Real-IP is set HERE, by Nginx, to the real connecting
        # socket address ($remote_addr) — a value the client cannot forge no
        # matter what headers they send. usage_tracking.get_client_ip() in
        # the app trusts X-Real-IP for exactly this reason.
        proxy_set_header X-Real-IP $remote_addr;

        # Kept for completeness/compatibility (some libraries expect it),
        # but the app does NOT trust this one for security decisions.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Audio generation / voice cloning can take several minutes (Modal's
        # own worker timeout is 600s) — must exceed that, or Nginx cuts the
        # browser connection long before the clone job actually finishes,
        # even though Modal itself completes successfully in the background.
        proxy_read_timeout 660s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 660s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /home/deploy/voxcraft/static/;
        expires 7d;
        access_log off;
    }
}
